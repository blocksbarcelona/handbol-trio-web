name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        continue-on-error: true
        with:
          timeout: 120000

      - name: Verify public site
        shell: bash
        run: |
          for attempt in {1..12}; do
            if curl --fail --silent --show-error --location \
              --output /tmp/chmontbui-index.html \
              "https://chmontbui.es/?deploy=${GITHUB_SHA}-${attempt}" \
              && cmp --silent index.html /tmp/chmontbui-index.html; then
              echo "The public site matches commit ${GITHUB_SHA}."
              exit 0
            fi

            sleep 10
          done

          echo "The public site does not match commit ${GITHUB_SHA}." >&2
          exit 1
