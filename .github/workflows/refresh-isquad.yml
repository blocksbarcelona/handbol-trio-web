name: Refresh iSquad Calendar & Results

on:
  schedule:
    # Weekdays: 09:00, 13:00, 17:00, 21:00 UTC (10:00, 14:00, 18:00, 22:00 CET)
    - cron: "0 9,13,17,21 * * 1-5"
    # Weekends (match days): every 2 hours from 09:00 to 21:00 UTC
    - cron: "0 9,11,13,15,17,19,21 * * 6,0"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.fetch.outputs.changed }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: prototypes/calendari-resultats/package-lock.json

      - name: Install dependencies
        working-directory: prototypes/calendari-resultats
        run: npm ci

      - name: Refresh iSquad schedule and scores
        id: fetch
        working-directory: prototypes/calendari-resultats
        run: node scripts/refresh-isquad.mjs

      - name: Rebuild GitHub Pages assets
        if: steps.fetch.outputs.changed == 'true'
        working-directory: prototypes/calendari-resultats
        run: npm run build:pages

      - name: Run site verification tests
        if: steps.fetch.outputs.changed == 'true'
        working-directory: prototypes/calendari-resultats
        run: npm test

      - name: Commit and push updated calendar
        if: steps.fetch.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          DATE=$(date -u +%Y-%m-%d)
          git add -A
          if git diff --cached --quiet; then
            echo "No staged changes to commit."
            exit 0
          fi
          git commit -m "chore(calendar): publish automated iSquad refresh ${DATE}"
          git push origin main

  deploy:
    needs: refresh
    if: needs.refresh.outputs.changed == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout updated main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          timeout: 120000
